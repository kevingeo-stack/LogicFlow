<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0b1326"/>
  <!-- Glowing shadow effect for S-tube -->
  <defs>
    <linearGradient id="tubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Flow S-path Tube -->
  <path d="M 150 160 
           L 240 160 
           C 270 160 270 190 270 220 
           L 270 290 
           C 270 320 270 350 300 350 
           L 380 350" 
        fill="none" 
        stroke="#06b6d4" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Center Node Box -->
  <rect x="206" y="216" width="100" height="80" rx="20" fill="#171f33" stroke="#06b6d4" stroke-width="14"/>
  
  <!-- Horizontal Input/Output Pins on center box -->
  <line x1="176" y1="245" x2="232" y2="245" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>
  <line x1="280" y1="267" x2="336" y2="267" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>

  <!-- Start Circle Node (Cyan) -->
  <circle cx="140" cy="160" r="30" fill="#38bdf8" filter="url(#glow)"/>

  <!-- End Circle Node (Indigo/Purple) -->
  <circle cx="372" cy="350" r="30" fill="#818cf8" filter="url(#glow)"/>
</svg>
